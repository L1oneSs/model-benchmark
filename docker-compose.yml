services:
  database:
    image: postgres:16-alpine
    container_name: mb-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-benchmark}
      POSTGRES_USER: ${POSTGRES_USER:-benchmark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benchmark}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/seed_recommendations.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-benchmark} -d ${POSTGRES_DB:-benchmark}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [mb-net]

  llm:
    image: ollama/ollama:latest
    container_name: mb-llm
    restart: unless-stopped
    mem_limit: 5g
    memswap_limit: 5g
    cpus: 4
    environment:
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_KEEP_ALIVE: 0
    volumes:
      - ollama:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [mb-net]

  llm-bootstrap:
    image: ollama/ollama:latest
    container_name: mb-llm-bootstrap
    depends_on:
      llm:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://llm:11434
      CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3.5:4b}
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    volumes:
      - ./llm/bootstrap.sh:/bootstrap.sh:ro
    restart: "no"
    networks: [mb-net]

  backend:
    build:
      context: ./backend
      args:
        STAND_GIT_COMMIT: ${STAND_GIT_COMMIT:-}
        STAND_REPOSITORY: ${STAND_REPOSITORY:-}
    container_name: mb-backend
    restart: unless-stopped
    volumes:
      - ./artifacts/agent-charts:/srv/artifacts/agent-charts
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-benchmark}:${POSTGRES_PASSWORD:-benchmark}@database:5432/${POSTGRES_DB:-benchmark}
      OLLAMA_URL: http://llm:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3.5:4b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-0}
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-${RAG_MAX_TOKENS:-384}}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      database:
        condition: service_healthy
      llm:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks: [mb-net]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_MODEL_SOURCE: ${VITE_MODEL_SOURCE:-cdn}
        STAND_GIT_COMMIT: ${STAND_GIT_COMMIT:-}
        STAND_GIT_DIRTY: ${STAND_GIT_DIRTY:-}
        STAND_REPOSITORY: ${STAND_REPOSITORY:-}
    container_name: mb-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks: [mb-net]

volumes:
  pgdata:
  ollama:

networks:
  mb-net:
    driver: bridge
