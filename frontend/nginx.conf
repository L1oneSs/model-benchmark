server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Одностраничное приложение: любой путь отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Веса моделей TensorFlow.js кешируем надолго: они не меняются
    location /models/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types application/javascript application/json text/css application/wasm;
    gzip_min_length 1024;
}
